[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2-harness"
version = "0.1.0"
description = "Observable function-level multi-agent experiments in a real StarCraft II player"
requires-python = ">=3.10,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<16", "httpx>=0.27,<1", "pydantic>=2.8,<3", "pillow>=10,<13"]

[project.optional-dependencies]
game = ["burnysc2==6.6.0", "protobuf==3.20.3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
sc2-harness = "sc2_harness.__main__:main"
sc2-viewer = "sc2_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["sc2_harness*", "sc2_viewer*"]

[tool.setuptools.package-data]
sc2_harness = ["web/*", "web/**/*"]
sc2_viewer = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110
